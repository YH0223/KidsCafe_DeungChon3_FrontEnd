name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main # main 브랜치에 코드가 push되거나 PR이 merge되면 트리거

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 코드 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Node.js 환경 세팅
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 의존성 패키지 캐싱 (빌드 시간 단축)
      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 4. 의존성 패키지 설치
      - name: Install Dependencies
        run: npm ci

      # 🌟 5. GitHub Secrets에서 환경변수를 가져와 빌드 타겟 .env 파일로 동적 생성
      # Secrets에 등록된 대형 텍스트(ENV_PRODUCTION)를 그대로 .env.production 파일로 드롭합니다.
      - name: Create Environment Variables File
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .env.production

      # 6. Next.js 빌드 수행 (메모리 가용량 상향 및 환경변수 빌드 인터셉트)
      - name: Build Next.js Application
        run: |
          NODE_OPTIONS="--max-old-space-size=4096" npm run build

      # 7. 배포 필수 결과물만 압축
      - name: Compress Build Artifacts
        run: tar -czf release.tar.gz .next package.json package-lock.json public next.config.mjs

      # 8. AWS EC2 (Ubuntu) 서버로 압축 파일 전송
      - name: Transfer over SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.FRONTEND_USERNAME }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          port: 22
          source: "release.tar.gz"
          target: "/home/ubuntu/kidscafe-frontend"

      # 9. 서버 내부 압축 해제 및 PM2 무중단 리로드
      - name: Deploy and Restart via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.FRONTEND_USERNAME }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/kidscafe-frontend
            tar -xzf release.tar.gz
            rm release.tar.gz
            

            npm install --production
            

            pm2 describe kidscafe-front > /dev/null && pm2 reload kidscafe-front || pm2 start npm --name "kidscafe-front" -- start